<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TMJ Soluções e Serviços</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,900&display=swap" rel="stylesheet">
<style>
:root{--brand:#04121a;--y:#ffc20e;--r:#f50025;--g:#00d95f;--bg:#fff;--ink:#0b1b22;--muted:#51656d;--line:#dbe5e3;--soft:#eef4f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071820;--ink:#f3f7f5;--muted:#9fb4bb;--line:#17384a;--soft:#0b2531}}
:root[data-theme="dark"]{--bg:#071820;--ink:#f3f7f5;--muted:#9fb4bb;--line:#17384a;--soft:#0b2531}
html{background:var(--brand);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:400 16px/1.55 Montserrat,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
h1,h2{font-style:italic;font-weight:900;margin:0;line-height:1.15}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.stripe{height:6px;background:linear-gradient(90deg,var(--y) 0 34%,var(--r) 34% 67%,var(--g) 67%)}
.hero{background:var(--brand);color:#f3f7f5;text-align:center;padding:14px 22px 76px;clip-path:polygon(0 0,100% 0,100% calc(100% - 40px),0 100%)}
.hero img{width:100%;height:auto;display:block;margin:0 auto 4px;-webkit-mask-image:radial-gradient(ellipse at center,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse at center,#000 62%,transparent 100%)}
.hero p{margin:0 0 22px;font-size:17px;color:#c6d6da}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;border-radius:14px;font-weight:700;font-size:17px}
.btn svg{width:22px;height:22px;flex:none;fill:currentColor}
.btn-wa{background:var(--g);color:#032210;box-shadow:0 4px 0 #00893c}
section{padding:28px 22px}
h2{font-size:28px;margin-bottom:16px}
.svc{list-style:none;margin:0;padding:0}
.svc li{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.svc li:last-child{border-bottom:1px solid var(--line)}
.svc .ic{width:40px;height:40px;flex:none;border-radius:10px;background:var(--y);display:grid;place-items:center}
.svc li:nth-child(3n+2) .ic{background:var(--r)}
.svc li:nth-child(3n) .ic{background:var(--g)}
.svc svg{width:22px;height:22px;fill:#04121a}
.svc li:nth-child(3n+2) svg{fill:#fff}
.svc b{display:block;font-size:17px}
.svc div span{color:var(--muted);font-size:15px}
.perks{background:var(--soft)}
.perks ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.perks b{display:block;font-size:16px;border-left:4px solid var(--g);padding-left:8px;margin-bottom:4px}
.perks li:nth-child(2) b{border-color:var(--y)}.perks li:nth-child(3) b{border-color:var(--r)}
.perks span{color:var(--muted);font-size:14px;display:block}
.work{background:#0a222e;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid figure{margin:0;border-radius:12px;overflow:hidden;aspect-ratio:4/5;background:#17384a}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.about p{margin:0 0 12px;max-width:62ch}
.contact{background:var(--brand);color:#f3f7f5;padding-bottom:36px}
.contact .list{display:grid;gap:12px}
.contact .btn{background:#fff;color:#04121a}
.contact .btn.wa{background:var(--g);color:#032210}
footer{background:var(--brand);color:#9fb4bb;text-align:center;font-size:13px;padding:0 22px 22px}
</style>
</head>
